<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Perfect Pitch">
<link rel="manifest" href="./manifest.webmanifest">
<title>Perfect Pitch Test</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#111;background:#f5f5f7}
*{box-sizing:border-box}
html,body{touch-action:manipulation}
body{margin:0;min-height:100vh;display:flex;justify-content:center}
.app{width:min(620px,100%);padding:28px 18px 38px}
h1{font-size:29px;letter-spacing:-.5px;margin:8px 0 5px;text-align:center}
.sub{text-align:center;color:#777;margin-bottom:24px}
.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 6px 28px #00000010}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.stat{background:#f2f2f7;border-radius:14px;padding:10px 5px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:#777}
#status{text-align:center;height:31px;font-size:17px;font-weight:600}
.listen{display:flex;gap:10px;margin:10px 0 18px}
button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.action{flex:1;padding:13px;border-radius:13px;background:#e9e9ee}
.action.primary{background:#111;color:#fff}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{min-height:62px;border-radius:15px;background:#f0f0f5;font-size:18px;font-weight:650;transition:transform .08s,background .12s}
.key:active{transform:scale(.97)}
.key.correct{background:#34c759;color:#fff}.key.wrong{background:#ff3b30;color:#fff}
.settings{margin-top:18px;padding-top:16px;border-top:1px solid #eee}
label{display:flex;align-items:center;gap:9px;color:#555;font-size:14px}
select{margin-left:auto;padding:8px;border-radius:9px;border:1px solid #ddd;background:#fff}
.reset{margin-top:12px;width:100%;padding:10px;border-radius:11px;background:#f2f2f7;color:#555}
.small{text-align:center;color:#888;font-size:13px;margin-top:17px;line-height:1.5}
@media(max-width:400px){.app{padding-left:12px;padding-right:12px}.key{min-height:57px;font-size:16px}}
</style>
</head>
<body>
<div class="app">
<h1>Perfect Pitch Test</h1>
<div class="sub">Listen to the note and identify its pitch</div>
<div class="card">
<div class="stats">
<div class="stat"><b id="done">0</b><span>Correct</span></div>
<div class="stat"><b id="errors">0</b><span>Wrong</span></div>
<div class="stat"><b id="score">100%</b><span>Accuracy</span></div>
<div class="stat"><b id="streak">0</b><span>Streak</span></div>
</div>
<div id="status">Press “Play Note” to begin</div>
<div class="listen">
<button class="action primary" id="hear">▶ Play Note</button>
<button class="action" id="skip">Next</button>
</div>
<div class="keys" id="keys"></div>
<div class="settings">
<label>Sound
<select id="wave">
<option value="piano" selected>Piano</option>
<option value="sine">Sine</option>
<option value="triangle">Triangle</option>
<option value="square">Square</option>
</select>
</label>
<button class="reset" id="reset">Reset Statistics</button>
</div>
<div class="small">C3–B5 · Chromatic · 36 possible notes · 12 pitch-class answers<br>Correct answers automatically advance to the next question.</div>
</div>
</div>

<script>
const NOTES=["C","C♯ / D♭","D","D♯ / E♭","E","F","F♯ / G♭","G","G♯ / A♭","A","A♯ / B♭","B"];
// Three-octave test range: C3 through B5 (36 possible notes).
const RANGE=[];
for(let midi=48;midi<=83;midi++) RANGE.push({
  midi,
  pitchClass:midi%12,
  freq:440*Math.pow(2,(midi-69)/12)
});
let ctx=null,current=-1,currentFreq=440,started=false,busy=false,done=0,errors=0,streak=0;

const $=id=>document.getElementById(id);
const keys=$("keys");
NOTES.forEach((name,i)=>{
  const b=document.createElement("button");
  b.className="key"; b.textContent=name; b.dataset.i=i;
  b.onclick=()=>answer(i,b); keys.appendChild(b);
});

function audio(){
  if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==="suspended") ctx.resume();
  return ctx;
}

function pianoNote(f){
  const ac=audio(), now=ac.currentTime, out=ac.createGain();
  out.gain.setValueAtTime(0.0001,now);
  out.gain.exponentialRampToValueAtTime(0.52,now+0.006);
  out.gain.exponentialRampToValueAtTime(0.0001,now+2.55);
  out.connect(ac.destination);

  // Additive, decaying partials approximate the bright attack and mellow decay
  // of a piano without requiring external audio files.
  const partials=[
    [1.00,1.00,2.45],[2.01,.46,1.90],[3.02,.20,1.55],
    [4.03,.095,1.25],[5.05,.050,1.05],[6.07,.028,.88],
    [7.10,.018,.74],[8.15,.012,.64]
  ];
  partials.forEach(([mult,amp,decay],i)=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(f*mult,now);
    o.detune.setValueAtTime((i%2?1:-1)*2,now);
    const a=amp*.19;
    g.gain.setValueAtTime(a,now);
    g.gain.exponentialRampToValueAtTime(0.0001,now+decay);
    o.connect(g).connect(out); o.start(now); o.stop(now+decay+.03);
  });

  // Short high-frequency attack component.
  const click=ac.createOscillator(),cg=ac.createGain();
  click.type="triangle"; click.frequency.setValueAtTime(f*6.8,now);
  cg.gain.setValueAtTime(.035,now);
  cg.gain.exponentialRampToValueAtTime(.0001,now+.075);
  click.connect(cg).connect(out); click.start(now); click.stop(now+.09);
}

function playNote(i){
  const ac=audio(), f=(i===current ? currentFreq : i), now=ac.currentTime;
  if($("wave").value==="piano"){ pianoNote(f); return; }
  const master=ac.createGain();
  master.gain.setValueAtTime(.0001,now);
  master.gain.exponentialRampToValueAtTime(.28,now+.012);
  master.gain.exponentialRampToValueAtTime(.0001,now+1.45);
  master.connect(ac.destination);
  const o=ac.createOscillator();
  o.type=$("wave").value; o.frequency.value=f;
  o.connect(master); o.start(now); o.stop(now+1.5);
}

function nextQuestion(){
  busy=false;
  document.querySelectorAll(".key").forEach(b=>b.classList.remove("correct","wrong"));
  const picked=RANGE[Math.floor(Math.random()*RANGE.length)];
  current=picked.pitchClass;
  currentFreq=picked.freq;
  started=true;
  $("status").textContent="Listen and choose the note";
  setTimeout(()=>playNote(current),100);
}

function answer(i,b){
  if(!started || current<0 || busy) return;
  if(i===current){
    b.classList.add("correct"); done++; streak++; update();
    $("status").textContent="✓ Correct — next note";
    busy=true;
    setTimeout(nextQuestion,550);
  }else{
    b.classList.add("wrong"); errors++; streak=0; update();
    $("status").textContent="✕ Try again";
    setTimeout(()=>b.classList.remove("wrong"),300);
  }
}
function update(){
  $("done").textContent=done; $("errors").textContent=errors;
  $("streak").textContent=streak;
  $("score").textContent=(done+errors?Math.round(done/(done+errors)*100):100)+"%";
}
$("hear").onclick=()=>current<0?nextQuestion():playNote(current);
$("skip").onclick=()=>nextQuestion();
$("reset").onclick=()=>{
  done=errors=streak=0;current=-1;started=false;busy=false;update();
  document.querySelectorAll(".key").forEach(b=>b.classList.remove("correct","wrong"));
  $("status").textContent="Press “Play Note” to begin";
};
if("serviceWorker" in navigator && location.protocol!=="file:"){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body>
</html>
